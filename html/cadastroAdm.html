<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BackStock – Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .card { max-width: 460px; }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 28px;
      transition: color 0.2s;
    }
    .btn-back:hover { color: var(--orange); }
    .btn-back svg { width: 14px; height: 14px; }

    .fields-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }

    .success-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(34, 139, 34, 0.1);
      border: 1px solid rgba(34, 139, 34, 0.3);
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .success-box.visible { display: flex; }
    .success-box svg { color: #6abf6a; width: 28px; height: 28px; }
    .success-box p { font-size: 13px; color: #6abf6a; line-height: 1.5; }

    @media (max-width: 480px) {
      .fields-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="card" id="cadastroCard">

    <a href="loginAdm.html" class="btn-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Voltar para o login
    </a>

    <div class="logo-wrap">
      <svg class="logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" fill="#2A1208" stroke="#3A2316" stroke-width="1.5"/>
        <circle cx="32" cy="32" r="28" fill="none" stroke="#8B3A10" stroke-width="4.5"/>
        <circle cx="32" cy="32" r="24" fill="#7A1515"/>
        <circle cx="32" cy="32" r="22" fill="#D4801A" opacity="0.85"/>
        <line x1="32" y1="10" x2="32" y2="54" stroke="#8B3A10" stroke-width="1.2" opacity="0.6"/>
        <line x1="10" y1="32" x2="54" y2="32" stroke="#8B3A10" stroke-width="1.2" opacity="0.6"/>
        <line x1="16.5" y1="16.5" x2="47.5" y2="47.5" stroke="#8B3A10" stroke-width="1.2" opacity="0.6"/>
        <line x1="47.5" y1="16.5" x2="16.5" y2="47.5" stroke="#8B3A10" stroke-width="1.2" opacity="0.6"/>
        <circle cx="26" cy="26" r="3" fill="#1C1C1C"/>
        <circle cx="38" cy="22" r="2.5" fill="#1C1C1C"/>
        <circle cx="22" cy="38" r="2.5" fill="#1C1C1C"/>
        <circle cx="40" cy="40" r="3" fill="#1C1C1C"/>
        <circle cx="32" cy="36" r="2" fill="#1C1C1C"/>
        <circle cx="22" cy="20" r="4" fill="white" opacity="0.06"/>
      </svg>

      <div class="logo-text">
        <div class="brand">Back<span>Stock</span></div>
        <div class="tagline">Cadastro de Administrador</div>
      </div>
    </div>

    <div class="divider"><span class="divider-label">Dados da conta</span></div>

    <!-- Alerta de erro -->
    <div class="alert" id="alertMsg" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="alertText">Erro ao realizar cadastro.</span>
    </div>

    <!-- Sucesso -->
    <div class="success-box" id="successBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <p id="successText">Cadastro realizado com sucesso!<br>Verifique seu e-mail para confirmar a conta.</p>
    </div>

    <div id="formFields">
      <div class="fields-row">
        <div class="field">
          <label for="nome">Nome</label>
          <div class="input-wrap">
            <input type="text" id="nome" placeholder="Seu nome" autocomplete="given-name" />
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
        </div>

        <div class="field">
          <label for="sobrenome">Sobrenome</label>
          <div class="input-wrap">
            <input type="text" id="sobrenome" placeholder="Seu sobrenome" autocomplete="family-name" />
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <div class="input-wrap">
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="input-wrap">
          <input type="password" id="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button class="toggle-pass" type="button" id="toggleSenha" aria-label="Mostrar senha">
            <svg id="eyeSenha" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmarSenha">Confirmar senha</label>
        <div class="input-wrap">
          <input type="password" id="confirmarSenha" placeholder="Repita a senha" autocomplete="new-password" />
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button class="toggle-pass" type="button" id="toggleConfirmar" aria-label="Mostrar confirmação">
            <svg id="eyeConfirmar" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-login" id="btnCadastrar" type="button">Criar conta</button>
    </div>

    <div class="card-footer">
      BackStock v1.0 &nbsp;·&nbsp; Estágio Supervisionado II
    </div>
  </div>

  <script type="module" src="../js/cadastroAdm.js"></script>
</body>
</html>
